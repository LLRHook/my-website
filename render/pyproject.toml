[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["out", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Blender executes entrypoints without adding their directory to sys.path.
"build_scene.py" = ["E402"]
"render.py" = ["E402"]
